# Sır Bende: yeni soruları kendiliğinden hazırlar.
# Her 3 saatte bir GitHub'ın ücretsiz yapay zekâsı (GitHub Models) yeni sorular yazar,
# başka bir yapay zekâ bunları kontrol eder, geçenler sorular.json dosyasına eklenir.
# Soru yazan kod aynı klasördeki uret.mjs dosyasındadır (depo ana klasörü).
# Uygulama sorular.json dosyasını arka planda okur. Ödeme ya da anahtar gerekmez.
name: Soru üret

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/soru-uret.yml"
      - "uret.mjs"

permissions:
  contents: write
  models: read

concurrency:
  group: soru-uret
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Yeni soruları üret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node uret.mjs

      - name: Kaydet
        run: |
          if [ -n "$(git status --porcelain sorular.json)" ]; then
            git config user.name "sirbende-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sorular.json
            git commit -m "Yeni sorular"
            git pull --rebase
            git push
          else
            echo "Bu tur değişiklik yok."
          fi
